<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control One — Perfil</title>
<link rel="stylesheet" href="../CSS/perfil.css">
<link rel="stylesheet" href="../CSS/nav-global.css">
</head>
<body>
<div class="app-shell">

  <header class="desktop-header">
    <a href="Panel principal.html" class="header-logo" title="Control One">
      <img src="../SRC/Logo.png" alt="Control One Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-fallback">1</span>
    </a>
    <div class="desktop-search">
      <i data-lucide="search" class="search-svg" width="18" height="18"></i>
      <input type="text" placeholder="BUSCAR">
    </div>
    <div class="desktop-actions">
      <a href="Panel principal.html" class="nav-icon-link" data-label="Inicio" title="Panel Principal"><i data-lucide="home" width="22" height="22"></i></a>
      <a href="Organizacion.html" class="nav-icon-link" data-label="Organización" title="Organización"><i data-lucide="layout-dashboard" width="22" height="22"></i></a>
      <a href="Actividades.html" class="nav-icon-link" data-label="Actividades" title="Actividades"><i data-lucide="layers" width="22" height="22"></i></a>
      <a href="Automatizacion.html" class="nav-icon-link" data-label="Automatización" title="Automatización"><i data-lucide="cpu" width="22" height="22"></i></a>
      <a href="Informacion.html" class="nav-icon-link" data-label="Info" title="Información"><i data-lucide="info" width="22" height="22"></i></a>
      <a href="perfil.html" class="nav-icon-link active-screen" data-label="Perfil" title="Perfil"><i data-lucide="user" width="22" height="22"></i></a>
    </div>
  </header>

  <nav class="desktop-subnav">
    <div class="subnav-container">
      <button class="subnav-btn tab-pill active" data-tab="perfil">PERFIL</button>
      <button class="subnav-btn tab-pill" data-tab="contactos">CONTACTOS</button>
      <button class="subnav-btn tab-pill" data-tab="otros">OTROS</button>
    </div>
  </nav>

  <main class="perfil-grid">

    <aside class="perfil-sidebar">
      <div class="avatar-wrap">
        <div class="avatar-circle">
          <i data-lucide="user" width="36" height="36"></i>
        </div>
      </div>
      <h2 class="perfil-nombre" id="perfilNombre">PEDRO SANCHEZ</h2>
      <p class="perfil-alias" id="perfilAlias">@Alias_guacho</p>

      <ul class="contactos-list" id="contactosList"></ul>
    </aside>

    <section class="panel-otros">
      <div class="otros-row" data-action="ver-ocultos">
        <i data-lucide="eye" width="18" height="18"></i> Ocultos
      </div>
      <div class="otros-row" data-action="ver-archivados">
        <i data-lucide="archive" width="18" height="18"></i> Archivados
      </div>
      <div class="otros-row" data-action="editar-perfil">
        <i data-lucide="at-sign" width="18" height="18"></i> Editar perfil
      </div>
      <div class="otros-row" data-action="config-correo">
        <i data-lucide="sliders-horizontal" width="18" height="18"></i> Configuración de correos
      </div>

      <div class="acciones-perfil otros-actions">
        <button class="btn btn-danger" id="btnCerrarSesion">
          <i data-lucide="log-in" width="16" height="16"></i> Iniciar sesión
        </button>
        <button class="btn btn-success" id="btnGuardarGeneral">
          <i data-lucide="check" width="16" height="16"></i> Guardar
        </button>
      </div>
    </section>

  </main>
</div>

<nav class="mobile-bottom-nav">
    <a href="Panel principal.html" class="dock-item" title="Inicio"><i data-lucide="home" width="22" height="22"></i><span>Inicio</span><span class="dock-dot"></span></a>
    <a href="Organizacion.html" class="dock-item" title="Organización"><i data-lucide="layout-dashboard" width="22" height="22"></i><span>Organizar</span><span class="dock-dot"></span></a>
    <a href="Actividades.html" class="dock-item" title="Actividades"><i data-lucide="layers" width="22" height="22"></i><span>Actividad</span><span class="dock-dot"></span></a>
    <a href="Automatizacion.html" class="dock-item" title="Automatización"><i data-lucide="cpu" width="22" height="22"></i><span>Auto</span><span class="dock-dot"></span></a>
    <a href="Informacion.html" class="dock-item" title="Información"><i data-lucide="info" width="22" height="22"></i><span>Info</span><span class="dock-dot"></span></a>
    <a href="perfil.html" class="dock-item active-screen" title="Perfil"><i data-lucide="user" width="22" height="22"></i><span>Perfil</span><span class="dock-dot"></span></a>
</nav>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose"><i data-lucide="x" width="18" height="18"></i></button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../backend/JS/perfil.js"></script>
</body>
</html>
