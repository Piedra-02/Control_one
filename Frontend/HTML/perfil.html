<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control One — Perfil</title>
<link rel="stylesheet" href="../CSS/perfil.css">
</head>
<body>
<div class="app-shell">

  <!-- Topbar (idéntico al de Organización / Panel Principal) -->
  <header class="desktop-header">
    <a href="perfil.html" class="header-logo" title="Control One">
      <img src="../SRC/Logo.png" alt="Control One Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-fallback">1</span>
    </a>
    <div class="desktop-search">
      <i data-lucide="search" class="search-svg" width="18" height="18"></i>
      <input type="text" placeholder="BUSCAR">
    </div>
    <div class="desktop-actions">
      <a href="Actividades.html" class="icon-btn" title="Actividades"><i data-lucide="layers" width="22" height="22"></i></a>
      <a href="Automatizacion.html" class="icon-btn" title="Automatización"><i data-lucide="cpu" width="22" height="22"></i></a>
      <button class="icon-btn" title="Chat / Notificaciones"><i data-lucide="message-circle" width="22" height="22"></i></button>
      <a href="Informacion.html" class="icon-btn" title="Información"><i data-lucide="info" width="22" height="22"></i></a>
    </div>
  </header>

  <nav class="desktop-subnav">
    <div class="subnav-container">
      <button class="subnav-btn tab-pill active" data-tab="perfil">PERFIL</button>
      <button class="subnav-btn tab-pill" data-tab="contactos">CONTACTOS</button>
      <button class="subnav-btn tab-pill" data-tab="otros">OTROS</button>
    </div>
  </nav>

  <main class="perfil-grid">

    <!-- Sidebar: avatar + contactos (igual al Figma, siempre visible) -->
    <aside class="perfil-sidebar">
      <div class="avatar-wrap">
        <div class="avatar-circle">
          <i data-lucide="user" width="36" height="36"></i>
        </div>
      </div>
      <h2 class="perfil-nombre" id="perfilNombre">PEDRO SANCHEZ</h2>
      <p class="perfil-alias" id="perfilAlias">@Alias_guacho</p>

      <ul class="contactos-list" id="contactosList"></ul>
    </aside>

    <!-- Panel principal: siempre el listado de "Otros", igual al Figma -->
    <section class="panel-otros">
      <div class="otros-row" data-action="ver-ocultos">
        <i data-lucide="eye" width="18" height="18"></i> Ocultos
      </div>
      <div class="otros-row" data-action="ver-archivados">
        <i data-lucide="archive" width="18" height="18"></i> Archivados
      </div>
      <div class="otros-row" data-action="editar-perfil">
        <i data-lucide="at-sign" width="18" height="18"></i> Editar perfil
      </div>
      <div class="otros-row" data-action="config-correo">
        <i data-lucide="sliders-horizontal" width="18" height="18"></i> Configuración de correos
      </div>

      <div class="acciones-perfil otros-actions">
        <button class="btn btn-danger" id="btnCerrarSesion">
          <i data-lucide="log-in" width="16" height="16"></i> Iniciar sesión
        </button>
        <button class="btn btn-success" id="btnGuardarGeneral">
          <i data-lucide="check" width="16" height="16"></i> Guardar
        </button>
      </div>
    </section>

  </main>
</div>

<!-- Dock inferior (solo visible en móvil) -->
<nav class="mobile-bottom-dock">
  <a href="Actividades.html" class="dock-btn" title="Actividades"><i data-lucide="layers" width="22" height="22"></i></a>
  <a href="Informacion.html" class="dock-btn" title="Información"><i data-lucide="info" width="22" height="22"></i></a>
  <button class="dock-search-btn" title="Buscar"><i data-lucide="search" width="20" height="20"></i></button>
  <a href="Automatizacion.html" class="dock-btn" title="Automatización"><i data-lucide="cpu" width="22" height="22"></i></a>
  <button class="dock-btn" title="Chat"><i data-lucide="message-circle" width="22" height="22"></i></button>
</nav>

<!-- Modal genérico: aquí se inyecta el contenido de cada tarjeta -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card">
    <button class="modal-close" id="modalClose"><i data-lucide="x" width="18" height="18"></i></button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../backend/JS/perfil.js"></script>
</body>
</html>
