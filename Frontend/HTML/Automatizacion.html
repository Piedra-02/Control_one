<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control One — Automatización</title>
<link rel="stylesheet" href="../CSS/automatizacion.css">
</head>
<body>
<div class="app-shell">

  <!-- Topbar (idéntico al de Organización / Panel Principal) -->
  <header class="desktop-header">
    <a href="Automatizacion.html" class="header-logo" title="Control One">
      <img src="../SRC/Logo.png" alt="Control One Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span class="logo-fallback">1</span>
    </a>
    <div class="desktop-search">
      <i data-lucide="search" class="search-svg" width="18" height="18"></i>
      <input type="text" placeholder="BUSCAR">
    </div>
    <div class="desktop-actions">
      <a href="Actividades.html" class="icon-btn" title="Actividades"><i data-lucide="layers" width="22" height="22"></i></a>
      <a href="Panel principal.html" class="icon-btn" title="Panel principal"><i data-lucide="cpu" width="22" height="22"></i></a>
      <button class="icon-btn" title="Chat / Notificaciones"><i data-lucide="message-circle" width="22" height="22"></i></button>
      <a href="Informacion.html" class="icon-btn" title="Información"><i data-lucide="info" width="22" height="22"></i></a>
    </div>
  </header>

  <!-- Tabs: en móvil cambian de panel, en escritorio solo resaltan -->
  <nav class="desktop-subnav">
    <div class="subnav-container">
      <button class="subnav-btn tab-pill" data-target="panel-reglas">REGLAS</button>
      <button class="subnav-btn tab-pill active" data-target="panel-acciones">ACCIONES</button>
      <button class="subnav-btn tab-pill" data-target="panel-vista-previa">VISTA PREVIA</button>
    </div>
  </nav>

  <main class="automatizacion-grid">

    <!-- ACCIONES -->
    <section class="card panel active" id="panel-acciones">
      <h2><i data-lucide="square-pen" width="20" height="20"></i> Acciones</h2>

      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" placeholder="Ingrese el nombre">

      <label for="descripcion">Descripción</label>
      <input type="text" id="descripcion" placeholder="Ingrese la descripción">

      <button class="btn btn-success" id="btnGuardar" style="margin-top:18px;">
        <i data-lucide="check" width="16" height="16"></i> Guardar automatización
      </button>

      <h3 style="margin-top:24px;">Historial de acciones</h3>
      <ul class="historial-list" id="historialList">
        <!-- Se llenan por JS; queda vacío hasta que se cree la primera automatización -->
      </ul>
    </section>

    <!-- REGLAS -->
    <section class="card panel" id="panel-reglas">
      <h2># Reglas</h2>
      <div class="regla-options" id="reglaOptions">
        <div class="regla-option" data-value="bidireccional">
          <i data-lucide="circle" width="16" height="16"></i> Bidireccional
        </div>
        <div class="regla-option" data-value="direccional">
          <i data-lucide="circle" width="16" height="16"></i> Direccional
        </div>
        <div class="regla-option" data-value="solo_si_se_cumple_condicion">
          <i data-lucide="circle" width="16" height="16"></i> Solo cuando se cumpla condición
        </div>
        <div class="regla-option" data-value="depurador_detallado">
          <i data-lucide="circle" width="16" height="16"></i> Depurador detallado
        </div>
        <div class="regla-option" data-value="solo_si_no_se_cumple_condicion">
          <i data-lucide="circle" width="16" height="16"></i> Solo cuando no se cumpla la condición
        </div>
      </div>

      <label for="condicion">Condición</label>
      <textarea id="condicion" placeholder="Ingrese la condición"></textarea>
    </section>

    <!-- VISTA PREVIA -->
    <section class="card-neutral panel" id="panel-vista-previa">
      <h2 style="color:var(--navy);"><i data-lucide="scan-eye" width="20" height="20"></i> Vista previa</h2>
      <div id="previewBox" class="preview-box">
        <p class="text-secondary">Completa "Acciones" y "Reglas" para ver aquí el resumen.</p>
      </div>
    </section>

  </main>
</div>

<!-- Dock inferior (solo visible en móvil) -->
<nav class="mobile-bottom-dock">
  <a href="Actividades.html" class="dock-btn" title="Actividades"><i data-lucide="layers" width="22" height="22"></i></a>
  <a href="Informacion.html" class="dock-btn" title="Información"><i data-lucide="info" width="22" height="22"></i></a>
  <button class="dock-search-btn" title="Buscar"><i data-lucide="search" width="20" height="20"></i></button>
  <a href="Panel principal.html" class="dock-btn" title="Panel principal"><i data-lucide="cpu" width="22" height="22"></i></a>
  <button class="dock-btn" title="Chat"><i data-lucide="message-circle" width="22" height="22"></i></button>
</nav>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../backend/JS/automatizacion.js"></script>
</body>
</html>
